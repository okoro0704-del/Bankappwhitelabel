# Railway: API service only (not the Vite frontend on Netlify).
# Set health check path to /health in the Railway UI if this file is ignored.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
