# Shared white-label SPA on Netlify — Supabase is the backend (Auth + DB + Edge Functions).
# Netlify env: VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY, VITE_TENANT_BASE_DOMAIN, VITE_DEPLOYMENT_DNS_TARGET

[build]
  base = "web"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
