# Shared white-label SPA — one site for all tenant hostnames.
# Build and publish from the Vite app directory.

[build]
  base = "web"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# SPA fallback: serve index.html for client-side routes (/login, /app, /master, …).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
